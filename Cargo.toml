[package]
name = "voice-control"
version = "2.1.25"
edition = "2024"
default-run = "voice-control"
license = "MIT"
repository = "https://github.com/dhruba-datta/hello"

[[test]]
name = "keyboard_layout"
harness = false

[build-dependencies]
cc = "1"

[features]
onnx-benchmark = ["dep:transcribe-rs"]

[profile.moonshine-lab]
inherits = "release"
debug-assertions = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
cpal = "0.18.2"
ctrlc = "3.5.2"
dirs = "7.0.0"
fs2 = "0.4.3"
getrandom = "0.4.3"
hound = "3.5.1"
libc = "0.2.189"
libloading = "0.9.0"
regex = "1.13.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3"] }
rubato = "5.0.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
transcribe-cpp = "=0.2.4"
transcribe-rs = { git = "https://github.com/cjpais/transcribe-rs", rev = "e37c66b6df43af51fde8dec34f98a07aaf09564c", features = ["onnx"], optional = true }
unicode-segmentation = "1.13.3"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.6.1", default-features = false }
block2 = "0.6.2"
core-graphics-types = "0.1.3"
core-video = "0.4.3"
crossterm = "0.29.0"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
gpui-symbols = { version = "0.6.1", default-features = false, features = ["component", "cache"] }
metal = "0.29.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-23"] }
realfft = "3.5.0"
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
ratatui = "0.30.2"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }
